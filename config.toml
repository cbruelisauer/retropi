# retropi configuration. Installed to /etc/retropi/config.toml; edits there
# survive updates. Relative paths are resolved against the service's working
# directory (/opt/retropi on the Pi, the repo root when run from a checkout).

[pins]
power = 26
radio = 13              # active high; pulled to GND in every other position
dab = 12                # treated as standby
bluetooth = 16
selector_settle_ms = 100

[leds]                  # reserved, not used yet
power = 5
status = 6

[adc]                   # MCP3008, software SPI
clk = 17
miso = 23
mosi = 24
cs = 25
volume_channel = 0
station_channel = 1
volume_tolerance = 5    # ADC counts the knob must move before it counts
station_tolerance = 7

[audio]
card = "sndrpihifiberry"  # check with: aplay -l
mixer = "Master"        # check with: amixer scontrols
volume_min_db = -80.0   # knob fully left; tune by ear
volume_max_db = -38.0   # knob fully right; tune by ear (the old scripts' 15-50 %)
startup_volume_db = -60.0
startup_sound = "sounds/connect.wav"
connect_sound = "sounds/connect.wav"
disconnect_sound = "sounds/disconnect.wav"

[mpd]
host = "localhost"
port = 6600
playlist = "stations"

[network]
wifi_connect_timeout_s = 30   # then try anyway
play_retry_s = 5              # how often a stopped or failed stream is restarted

[bluetooth]
name = "RetroPi"
disable_wifi = true
pairing_window_s = 120

[tuning]                # static between stations; this table and each key are optional
enabled = true
station_gap = 0.15      # share of each station's band, around every border, that only plays static
tune_settle_ms = 300    # how long the dial must rest on a station before it tunes in
static_level_db = -6.0  # static level; tune by ear against the stations
static_fade_ms = 300
static_sound = "sounds/static.wav"  # 16-bit WAV, played in a loop; a real recording works too
