# /etc/asound.conf, installed by retropi.
#
# The HiFiBerry hw device takes one client at a time, so MPD, bluealsa-aplay
# and the sound effects all play through this dmix. They run as different
# users (mpd, root, pi), hence the fixed ipc_key shared by every user.

pcm.!default {
    type plug
    slave.pcm "retropi_dmix"
}

pcm.retropi_dmix {
    type dmix
    ipc_key 4711
    ipc_key_add_uid false
    ipc_perm 0666
    slave {
        pcm "hw:CARD=sndrpihifiberry,DEV=0"
        format S16_LE
        rate 44100
        period_size 1024
        buffer_size 8192
    }
}

ctl.!default {
    type hw
    card sndrpihifiberry
}
