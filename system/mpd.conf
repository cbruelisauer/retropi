# /etc/mpd.conf, installed by retropi (replaces the Debian default).

music_directory     "/var/lib/mpd/music"
playlist_directory  "/var/lib/mpd/playlists"
db_file             "/var/lib/mpd/tag_cache"
state_file          "/var/lib/mpd/state"
sticker_file        "/var/lib/mpd/sticker.sql"
user                "mpd"
bind_to_address     "localhost"
port                "6600"

# Don't resume playback on boot; retropi starts the stream when the
# selector is on Radio.
restore_paused      "yes"

audio_output {
    type        "alsa"
    name        "RetroPi"
    device      "default"   # the shared dmix from /etc/asound.conf
    mixer_type  "none"      # only the volume knob sets the level
}

filesystem_charset  "UTF-8"
