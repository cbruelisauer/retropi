# /etc/bluetooth/main.conf, installed by retropi (replaces the Debian
# default, whose settings are all commented out).

[General]
# retropi closes the pairing window itself after pairing_window_s.
DiscoverableTimeout = 0
# A phone that forgot the radio re-pairs with Just Works while BlueZ still
# holds the old bond. The default (never) rejects that silently and the
# phone drops after a few seconds; confirm asks retropi's agent, which
# allows it while the pairing window is open.
JustWorksRepairing = confirm

[Policy]
# The adapter stays off until the selector is on Bluetooth.
AutoEnable=false
